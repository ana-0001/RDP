name: RDP-Ngrok

# ============================================================
# 🚀 مُحفِّزات التشغيل
# ============================================================
on:
  # ▶ تشغيل يدوي مع خيارات
  workflow_dispatch:
    inputs:
      NGROK_AUTH_TOKEN:
        description: "Ngrok Auth Token"
        default: "382MOw5WgsD87k14eKY7zIT1ohk_3K1wsTenLUdB61qJtwcZf"

      runs-on:
        description: "Select Operating System"
        type: choice
        default: windows-2019
        options:
          - windows-2019
          - windows-latest
          - ubuntu-24.04
          - fedora-42

      user:
        description: "Username"
        default: root

      pass:
        description: "Password (empty = auto)"
        default: admin000

  # ⏰ تشغيل تلقائي كل 5 ساعات
  schedule:
    - cron: '0 */5 * * *'

  # 📤 تشغيل تلقائي عند كل تعديل على الكود
  push:
    branches:
      - main

# ============================================================
# ⚙️ الوظائف
# ============================================================
jobs:
  remote:
    runs-on: ${{ inputs.runs-on || 'windows-2019' }}
    timeout-minutes: 350

    steps:
    # ==================================================
    # 🔐 تحضير بيانات الاعتماد
    # ==================================================
    - name: Prepare credentials
      shell: bash
      run: |
        # --- كلمة المرور ---
        if [ -z "${{ inputs.pass }}" ]; then
          PASS="admin000"
        else
          PASS="${{ inputs.pass }}"
        fi

        # --- اسم المستخدم ---
        USER="${{ inputs.user }}"
        if [ -z "$USER" ]; then USER="root"; fi

        # --- Ngrok Token ---
        TOKEN="${{ inputs.NGROK_AUTH_TOKEN }}"
        if [ -z "$TOKEN" ]; then
          TOKEN="382MOw5WgsD87k14eKY7zIT1ohk_3K1wsTenLUdB61qJtwcZf"
        fi

        # --- حفظ في متغيرات البيئة ---
        echo "REMOTE_USER=$USER" >> $GITHUB_ENV
        echo "REMOTE_PASS=$PASS" >> $GITHUB_ENV
        echo "NGROK_TOKEN=$TOKEN" >> $GITHUB_ENV

    # ==================================================
    # 📦 تثبيت ngrok (Windows)
    # ==================================================
    - name: Install ngrok (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dir="$env:ProgramFiles\ngrok"
        mkdir $dir -Force | Out-Null
        Invoke-WebRequest `
          https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip `
          -OutFile "$env:TEMP\ngrok.zip"
        Expand-Archive "$env:TEMP\ngrok.zip" $dir -Force
        echo "$dir" | Out-File -Append $env:GITHUB_PATH

    # ==================================================
    # 📦 تثبيت ngrok (Linux)
    # ==================================================
    - name: Install ngrok (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sudo apt update || true
        sudo apt install curl unzip -y || true
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc |
          sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com stable main" |
          sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install ngrok -y

    # ==================================================
    # 🔑 تكوين ngrok
    # ==================================================
    - name: Configure ngrok
      shell: bash
      run: |
        ngrok config add-authtoken $NGROK_TOKEN

    # ==================================================
    # 🪟 تفعيل RDP (Windows)
    # ==================================================
    - name: Enable RDP (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-ItemProperty `
          'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name fDenyTSConnections -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        net user $env:REMOTE_USER $env:REMOTE_PASS /add
        net localgroup administrators $env:REMOTE_USER /add
        net localgroup "Remote Desktop Users" $env:REMOTE_USER /add

    # ==================================================
    # 🌐 تشغيل نفق ngrok لـ RDP (Windows) — في الخلفية
    # ==================================================
    - name: Start ngrok RDP (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow
        Start-Sleep -Seconds 10

    # ==================================================
    # 🐧 إعداد سطح مكتب Linux + VNC
    # ==================================================
    - name: Linux Desktop + VNC
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sudo apt update || sudo dnf update -y || true

        sudo apt install -y \
          ubuntu-desktop-minimal \
          tigervnc-standalone-server \
          gnome-session gdm3 \
          || sudo dnf groupinstall "GNOME Desktop" -y

        sudo useradd -m $REMOTE_USER || true
        echo "$REMOTE_USER:$REMOTE_PASS" | sudo chpasswd
        sudo usermod -aG sudo $REMOTE_USER || true

        mkdir -p /home/$REMOTE_USER/.vnc
        echo "$REMOTE_PASS" | vncpasswd -f > /home/$REMOTE_USER/.vnc/passwd
        chmod 600 /home/$REMOTE_USER/.vnc/passwd
        chown -R $REMOTE_USER:$REMOTE_USER /home/$REMOTE_USER/.vnc

        cat <<EOF > /home/$REMOTE_USER/.vnc/xstartup
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec gnome-session &
        EOF
        chmod +x /home/$REMOTE_USER/.vnc/xstartup

        sudo -u $REMOTE_USER vncserver :1 -localhost no

    # ==================================================
    # 🌐 تشغيل نفق ngrok لـ VNC (Linux) — في الخلفية
    # ==================================================
    - name: Start ngrok VNC (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ngrok tcp 5901 --log=stdout &
        sleep 10

    # ==================================================
    # 📡 عرض معلومات الاتصال (تعمل الآن فعليًا!)
    # ==================================================
    - name: Show machine info
      shell: bash
      run: |
        echo "=========================================="
        echo "  🖥️  SYSTEM INFO"
        echo "=========================================="
        uname -a || ver
        echo ""
        echo "=========================================="
        echo "  🌍 PUBLIC IP"
        echo "=========================================="
        curl -s https://api.ipify.org || true
        echo ""
        echo ""
        echo "=========================================="
        echo "  🔗 NGROK TUNNEL (عنوان الاتصال)"
        echo "=========================================="
        sleep 5
        curl -s http://127.0.0.1:4040/api/tunnels | \
          python3 -m json.tool 2>/dev/null || \
          curl -s http://127.0.0.1:4040/api/tunnels || true
        echo ""
        echo "=========================================="
        echo "  👤 USERNAME: $REMOTE_USER"
        echo "  🔑 PASSWORD: $REMOTE_PASS"
        echo "=========================================="

    # ==================================================
    # ♻️ البقاء نشطًا (يعمل الآن فعليًا!)
    # ==================================================
    - name: Keep Alive
      shell: bash
      run: |
        while true; do
          echo "✅ Runner alive at $(date)"
          sleep 300
        done
