name: RDP-Ngrok

# ============================================================
# 🚀 مُحفِّزات التشغيل
# ============================================================
on:
  workflow_dispatch:
    inputs:
      NGROK_AUTH_TOKEN:
        description: "Ngrok Auth Token"
        default: "382MOw5WgsD87k14eKY7zIT1ohk_3K1wsTenLUdB61qJtwcZf"

      runs-on:
        description: "Select Operating System"
        type: choice
        default: ubuntu-24.04-gnome
        options:
          - ubuntu-24.04-gnome      # 🐧 Ubuntu 24.04 + GNOME Desktop الاصلي (VNC)
          - ubuntu-24.04-server     # 🖧 Ubuntu Server (SSH فقط)
          - windows-2019            # 🪟 Windows Server 2019 (RDP)
          - windows-latest          # 🪟 أحدث Windows (RDP)
          - fedora-42               # 🎩 Fedora (VNC)

      user:
        description: "Username"
        default: root

      pass:
        description: "Password (empty = auto)"
        default: admin000

      auto_schedule:
        description: "Auto Schedule (يتطلب Variable: AUTO_SCHEDULE=on)"
        type: choice
        default: "off"
        options:
          - "off"
          - "on"

      install_tools:
        description: "Install Development Tools"
        type: choice
        default: "on"
        options:
          - "on"
          - "off"

  schedule:
    - cron: '0 */5 * * *'

# ============================================================
# ⚙️ الوظائف
# ============================================================
jobs:
  remote:
    runs-on: >-
      ${{
        (inputs.runs-on == 'ubuntu-24.04-gnome'  && 'ubuntu-24.04') ||
        (inputs.runs-on == 'ubuntu-24.04-server' && 'ubuntu-24.04') ||
        (inputs.runs-on == 'fedora-42'           && 'ubuntu-24.04') ||
        inputs.runs-on ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 350

    if: >-
      github.event_name != 'schedule' ||
      vars.AUTO_SCHEDULE == 'on'

    steps:
    # ==================================================
    # 🔐 تحضير بيانات الاعتماد
    # ==================================================
    - name: Prepare credentials
      shell: bash
      run: |
        set -e

        PASS="${{ inputs.pass }}"
        if [ -z "$PASS" ]; then PASS="admin000"; fi

        USER="${{ inputs.user }}"
        if [ -z "$USER" ]; then USER="root"; fi

        TOKEN="${{ inputs.NGROK_AUTH_TOKEN }}"
        if [ -z "$TOKEN" ]; then
          TOKEN="382MOw5WgsD87k14eKY7zIT1ohk_3K1wsTenLUdB61qJtwcZf"
        fi

        SYSTEM="${{ inputs.runs-on }}"
        if [ -z "$SYSTEM" ]; then SYSTEM="ubuntu-24.04-gnome"; fi

        INSTALL="${{ inputs.install_tools }}"
        if [ -z "$INSTALL" ]; then INSTALL="on"; fi

        if [ "$USER" = "root" ]; then
          HOME_DIR="/root"
        else
          HOME_DIR="/home/$USER"
        fi

        {
          echo "REMOTE_USER=$USER"
          echo "REMOTE_PASS=$PASS"
          echo "NGROK_TOKEN=$TOKEN"
          echo "SYSTEM_TYPE=$SYSTEM"
          echo "INSTALL_TOOLS=$INSTALL"
          echo "HOME_DIR=$HOME_DIR"
        } >> "$GITHUB_ENV"

        echo "=========================================="
        echo "  🖥️  System : $SYSTEM"
        echo "  👤 User   : $USER"
        echo "  🏠 Home   : $HOME_DIR"
        echo "  🔧 Tools  : $INSTALL"
        echo "=========================================="

    # ==================================================
    # 📦 تثبيت ngrok (Windows)
    # ==================================================
    - name: Install ngrok (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dir = "$env:ProgramFiles\ngrok"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Invoke-WebRequest `
          "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
          -OutFile "$env:TEMP\ngrok.zip"
        Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath $dir -Force
        Add-Content -Path $env:GITHUB_PATH -Value $dir
        & "$dir\ngrok.exe" version

    # ==================================================
    # 📦 تثبيت ngrok (Linux)
    # ==================================================
    - name: Install ngrok (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -e
        curl -fsSL \
          "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" \
          -o /tmp/ngrok.tgz
        sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin
        sudo chmod +x /usr/local/bin/ngrok
        rm -f /tmp/ngrok.tgz
        ngrok version

    # ==================================================
    # 🔑 تكوين ngrok
    # ==================================================
    - name: Configure ngrok
      shell: bash
      run: |
        set -e
        ngrok config add-authtoken "$NGROK_TOKEN"
        echo "✅ ngrok configured"

    # ==================================================
    # 🪟 تفعيل RDP (Windows)
    # ==================================================
    - name: Enable RDP (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name fDenyTSConnections -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        $u = $env:REMOTE_USER
        $p = $env:REMOTE_PASS
        if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
          net user $u $p /add
        } else {
          net user $u $p
        }
        net localgroup administrators $u /add 2>$null
        net localgroup "Remote Desktop Users" $u /add 2>$null
        Write-Host "✅ RDP enabled for $u"

    # ==================================================
    # 🐧 إعداد Ubuntu GNOME الاصلي + VNC
    # ==================================================
    - name: Setup Ubuntu GNOME Desktop + VNC
      if: env.SYSTEM_TYPE == 'ubuntu-24.04-gnome' || env.SYSTEM_TYPE == 'fedora-42'
      shell: bash
      run: |
        set -e
        export DEBIAN_FRONTEND=noninteractive

        echo "📦 Installing Ubuntu GNOME Desktop..."
        sudo apt-get update -y
        sudo apt-get install -y \
          ubuntu-desktop-minimal \
          gnome-session \
          gnome-shell \
          gnome-terminal \
          dbus-x11 \
          tigervnc-standalone-server \
          tigervnc-common \
          yaru-theme-gtk yaru-theme-icon

        # ---------- المستخدم ----------
        if [ "$REMOTE_USER" != "root" ]; then
          sudo useradd -m -s /bin/bash "$REMOTE_USER" 2>/dev/null || true
          sudo usermod -aG sudo "$REMOTE_USER" || true
        fi
        echo "$REMOTE_USER:$REMOTE_PASS" | sudo chpasswd

        # ---------- إعداد VNC ----------
        sudo mkdir -p "$HOME_DIR/.vnc"
        echo "$REMOTE_PASS" | vncpasswd -f | sudo tee "$HOME_DIR/.vnc/passwd" >/dev/null
        sudo chmod 600 "$HOME_DIR/.vnc/passwd"

        # ---------- xstartup تشغيل Ubuntu GNOME الأصلي ----------
        sudo tee "$HOME_DIR/.vnc/xstartup" > /dev/null <<'EOF'
        #!/bin/bash
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        export XDG_SESSION_TYPE=x11
        export XDG_CURRENT_DESKTOP=ubuntu:GNOME
        export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg
        export GNOME_SHELL_SESSION_MODE=ubuntu

        dbus-update-activation-environment --systemd --all 2>/dev/null || true

        if [ -x /usr/bin/gnome-session ]; then
          exec dbus-run-session gnome-session --session=ubuntu
        else
          exec gnome-session
        fi
        EOF

        sudo chmod +x "$HOME_DIR/.vnc/xstartup"
        sudo chown -R "$REMOTE_USER:$REMOTE_USER" "$HOME_DIR/.vnc" 2>/dev/null || true

        # إيقاف أي جلسات قديمة وتشغيل خادم VNC
        sudo -u "$REMOTE_USER" vncserver -kill :1 2>/dev/null || true
        sudo -u "$REMOTE_USER" vncserver :1 \
          -localhost no \
          -geometry 1920x1080 \
          -depth 24

        echo "✅ Ubuntu GNOME ready on :5901"

    # ==================================================
    # 🖧 إعداد Ubuntu Server (SSH فقط)
    # ==================================================
    - name: Setup Ubuntu Server (SSH only)
      if: env.SYSTEM_TYPE == 'ubuntu-24.04-server'
      shell: bash
      run: |
        set -e
        export DEBIAN_FRONTEND=noninteractive

        sudo apt-get update -y
        sudo apt-get install -y openssh-server

        if [ "$REMOTE_USER" != "root" ]; then
          sudo useradd -m -s /bin/bash "$REMOTE_USER" 2>/dev/null || true
          sudo usermod -aG sudo "$REMOTE_USER" || true
        fi
        echo "$REMOTE_USER:$REMOTE_PASS" | sudo chpasswd

        sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo systemctl restart ssh || sudo service ssh restart || true

        echo "✅ SSH ready on :22"

    # ==================================================
    # 🛠️ تثبيت أدوات التطوير (Linux)
    # ==================================================
    - name: Install Development Tools (Linux)
      if: runner.os != 'Windows' && env.INSTALL_TOOLS == 'on'
      shell: bash
      run: |
        set +e
        export DEBIAN_FRONTEND=noninteractive

        sudo apt-get update -y || true
        sudo apt-get install -y \
          wget curl git ca-certificates gnupg lsb-release \
          python3 python3-pip python3-venv unzip tar \
          software-properties-common apt-transport-https \
          || true

        # 01) Google Chrome + Firefox
        echo "📦 01 - Browsers"
        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
          | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg 2>/dev/null
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
          | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
        sudo apt-get update -y || true
        sudo apt-get install -y google-chrome-stable firefox || true

        # 02) Git
        echo "📦 02 - Git"
        sudo apt-get install -y git || true

        # 03) NVM + Node 20.15.1 + Yarn + PNPM
        echo "📦 03 - NVM / Node / Yarn / PNPM"
        sudo -u "$REMOTE_USER" bash <<'NODEEOF' || true
        set +e
        export HOME="${HOME_DIR:-$HOME}"
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm install 20.15.1
        nvm alias default 20.15.1
        nvm use 20.15.1
        npm install -g yarn pnpm npm@latest
        NODEEOF

        # 04) VS Code
        echo "📦 04 - VS Code"
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg 2>/dev/null
        echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
          | sudo tee /etc/apt/sources.list.d/vscode.list >/dev/null
        sudo apt-get update -y || true
        sudo apt-get install -y code || true

        # 05) Bruno
        echo "📦 05 - Bruno"
        wget -q https://github.com/usebruno/bruno/releases/download/v1.38.1/bruno_1.38.1_amd64_linux.deb -O /tmp/bruno.deb || true
        sudo dpkg -i /tmp/bruno.deb 2>/dev/null || sudo apt-get install -f -y || true
        rm -f /tmp/bruno.deb

        # 06) Docker + Dockge + PostgreSQL + MySQL + Adminer + MinIO
        echo "📦 06 - Docker + Services"
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
          sudo sh /tmp/get-docker.sh || true
          rm -f /tmp/get-docker.sh
        fi
        sudo usermod -aG docker "$REMOTE_USER" 2>/dev/null || true

        sudo mkdir -p /opt/stacks /opt/data/postgres /opt/data/mysql /opt/data/minio /opt/stacks/dockge/data

        sudo tee /opt/stacks/docker-compose.yml > /dev/null <<'COMPOSE'
        services:
          dockge:
            image: louislam/dockge:1
            container_name: dockge
            restart: unless-stopped
            ports: ["5001:5001"]
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /opt/stacks/dockge/data:/app/data
              - /opt/stacks:/opt/stacks
            environment:
              DOCKGE_STACKS_DIR: /opt/stacks

          postgres:
            image: postgres:16
            container_name: postgres
            restart: unless-stopped
            ports: ["5432:5432"]
            environment:
              POSTGRES_USER: admin
              POSTGRES_PASSWORD: admin000
              POSTGRES_DB: maindb
            volumes:
              - /opt/data/postgres:/var/lib/postgresql/data

          mysql:
            image: mysql:8
            container_name: mysql
            restart: unless-stopped
            ports: ["3306:3306"]
            environment:
              MYSQL_ROOT_PASSWORD: admin000
              MYSQL_DATABASE: maindb
              MYSQL_USER: admin
              MYSQL_PASSWORD: admin000
            volumes:
              - /opt/data/mysql:/var/lib/mysql

          adminer:
            image: adminer:latest
            container_name: adminer
            restart: unless-stopped
            ports: ["8080:8080"]

          minio:
            image: minio/minio:latest
            container_name: minio
            restart: unless-stopped
            ports: ["9000:9000", "9001:9001"]
            environment:
              MINIO_ROOT_USER: admin
              MINIO_ROOT_PASSWORD: admin000
            command: server /data --console-address ":9001"
            volumes:
              - /opt/data/minio:/data
        COMPOSE

        cd /opt/stacks
        sudo docker compose up -d 2>/dev/null || true

    # ==================================================
    # 🌐 ngrok tunnels (خلفية)
    # ==================================================
    - name: Start ngrok RDP (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Start-Process -FilePath "ngrok" -ArgumentList "tcp","3389","--log=stdout" -WindowStyle Hidden
        Start-Sleep -Seconds 12

    - name: Start ngrok VNC (Linux GNOME)
      if: env.SYSTEM_TYPE == 'ubuntu-24.04-gnome' || env.SYSTEM_TYPE == 'fedora-42'
      shell: bash
      run: |
        nohup ngrok tcp 5901 --log=stdout > /tmp/ngrok.log 2>&1 &
        echo $! > /tmp/ngrok.pid
        sleep 12

    - name: Start ngrok SSH (Linux Server)
      if: env.SYSTEM_TYPE == 'ubuntu-24.04-server'
      shell: bash
      run: |
        nohup ngrok tcp 22 --log=stdout > /tmp/ngrok.log 2>&1 &
        echo $! > /tmp/ngrok.pid
        sleep 12

    # ==================================================
    # 📡 معلومات الاتصال
    # ==================================================
    - name: Show machine info
      shell: bash
      run: |
        sleep 3
        echo "=========================================="
        echo "  🖥️  SYSTEM"
        echo "=========================================="
        uname -a 2>/dev/null || ver 2>/dev/null || true
        echo ""
        echo "=========================================="
        echo "  🔗 NGROK TUNNEL"
        echo "=========================================="
        curl -fsS http://127.0.0.1:4040/api/tunnels | python3 -m json.tool 2>/dev/null || true
        echo ""
        echo "=========================================="
        echo "  👤 CREDENTIALS"
        echo "=========================================="
        echo "  Username : $REMOTE_USER"
        echo "  Password : $REMOTE_PASS"
        echo "=========================================="

    # ==================================================
    # ♻️ Keep Alive
    # ==================================================
    - name: Keep Alive
      shell: bash
      run: |
        while true; do
          echo "✅ alive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 300
        done
